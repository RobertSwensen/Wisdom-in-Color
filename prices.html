<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Wisdom in Color - Print Pricing</title>
<link rel="stylesheet" href="css/styles.css">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Great+Vibes&display=swap" rel="stylesheet">
</head>
<body>

<div class="prices-page">
    <h1 class="home-title">Print Pricing</h1>
    <p class="prices-intro">
        Prints are available in paper or canvas, priced by size. Contact us to place an order or ask about a custom size.
    </p>

    <table class="price-table">
        <thead>
            <tr>
                <th>Size</th>
                <th>Paper</th>
                <th>Canvas</th>
            </tr>
        </thead>
        <tbody>
            <tr>
                <td>8 x 12</td>
                <td>$54</td>
                <td>$65</td>
            </tr>
            <tr>
                <td>12 x 18</td>
                <td>$112</td>
                <td>$135</td>
            </tr>
            <tr>
                <td>16 x 24</td>
                <td>$186</td>
                <td>$223</td>
            </tr>
            <tr>
                <td>24 x 30</td>
                <td>$360</td>
                <td>$432</td>
            </tr>
            <tr>
                <td>30 x 40</td>
                <td>$600</td>
                <td>$720</td>
            </tr>
        </tbody>
    </table>

    <p class="prices-note">Prices subject to change. Shipping is not included.</p>

    <div class="contact-row">
        <button id="contactBtn" class="gold-btn">Email Kathy</button>
    </div>
</div>

<button id="backPrevBtn" class="gold-btn nav-fixed left">Return to Previous Page</button>
<button id="backHomeBtn" class="gold-btn nav-fixed right">Return to Home</button>

<script>
    document.getElementById("contactBtn").onclick = () => {
        const subject = "Print Pricing Inquiry";
        const body = "Hello Kathy,\n\nI'm interested in acquiring an original or print painting, or in commissioning a painting. Please let me know more details.\n\nThank you!";
        // Opens Gmail compose in the browser (Chrome) – more reliable than mailto:
        const gmailUrl = "https://mail.google.com/mail/?view=cm&fs=1&to=" +
            encodeURIComponent("kathyleland@fea.net") +
            "&su=" + encodeURIComponent(subject) +
            "&body=" + encodeURIComponent(body);
        window.open(gmailUrl, "_blank");
    };
    document.getElementById("backHomeBtn").onclick = () => {
        window.location.href = "home.html";
    };
    document.getElementById("backPrevBtn").onclick = () => {
        if (document.referrer && document.referrer.indexOf(window.location.host) !== -1) {
            window.history.back();
        } else {
            window.location.href = "home.html";
        }
    };
</script>

</body>
</html>
